<!doctype html><html lang="ko"><meta charset="UTF-8"><title>화면 분리 회귀 검사</title>
<body><label>검사 화면 <select id="screen"></select></label><pre id="requests"></pre><div id="root"></div>
<script type="module">
import { createElement as h, useState } from 'react'
import { createRoot } from 'react-dom/client'
import { QueryClient, QueryClientProvider } from '@tanstack/react-query'
import { createRootRoute, createRoute, createRouter, createMemoryHistory, Outlet, RouterProvider } from '@tanstack/react-router'
import { ThemeProvider } from 'styled-components'
import { PlannerPage, PlannerGroupPage } from '/src/widgets/planner/ui/PlannerPage.tsx'
import { TripCardsPage, TripCardDetailPage, TripCardCreatePage, TripCardDeletePage } from '/src/widgets/trip-cards/ui/TripCardsPage.tsx'
import { ProfileInsightPage } from '/src/widgets/profile-insights/ui/ProfileInsightPage.tsx'
import { NotificationPage, NotificationDetailPage } from '/src/widgets/notifications/ui/NotificationPage.tsx'
import { apiClient } from '/src/shared/libs/api-client.ts'
import { appTheme } from '/src/shared/theme/index.ts'
// npm run dev -- --host 127.0.0.1 --port 5182; open /tests/refactor-pages.html.
// Synthetic responses only. Optional ?state=empty or ?state=error checks failure states.
if (location.hostname !== '127.0.0.1') throw new Error('127.0.0.1에서 실행해주세요.')
const state = new URLSearchParams(location.search).get('state')
sessionStorage.setItem('parttrip:active-planner-id', '1')
const cards = [{ cardId: 1, cityName: '서울', regionCode: '11', regionName: '서울특별시', startDate: '2026-09-01', endDate: '2026-09-02', photoCount: 1 }]
const notification = { notificationId: 10, type: 'TRIP_CARD_CREATED', category: 'PHOTO', title: '검사 알림', body: '검사 내용', linkType: 'TRIP_CARD', linkId: 1, read: false, createdAt: '2026-09-30T09:00:00+09:00' }
let requests = []
function log(method, url) { requests.push(`${method} ${url}`); document.getElementById('requests').textContent = requests.join('\n') }
apiClient.get = async (url, config) => {
  log('GET', url)
  if (state === 'error') throw new Error('검사 오류')
  let data
  if (url === '/profile/myInfo') data = { userId: 'qa', nickName: '검사' }
  else if (url === '/notifications/unread-count') data = { unreadCount: state === 'empty' ? 0 : 1 }
  else if (url === '/notifications') data = { items: state === 'empty' || config?.params?.cursor ? [] : [notification], hasNext: !config?.params?.cursor && state !== 'empty', nextCursor: 10 }
  else if (url === '/travel-cards') data = state === 'empty' ? [] : cards
  else if (url === '/travel-cards/1') data = { cardId: 1, startDate: cards[0].startDate, endDate: cards[0].endDate, timeline: state === 'empty' ? [] : [{ entryId: 1, type: 'PLACE', placeName: '검사 장소', date: '2026-09-01' }] }
  else if (url === '/region-map') data = { visited: state === 'empty' ? [] : [{ regionCode: '11', regionName: '서울특별시', tripCount: 1 }], trips: [] }
  else if (url === '/planners') data = state === 'empty' ? [] : [{ plannerId: 1, title: '검사 여행', cityName: '서울', status: 'CONFIRMED', startDate: '2026-10-01', endDate: '2026-10-02', memberCount: 2, joinedMemberCount: 1 }]
  else if (url === '/planners/1') data = { plannerId: 1, role: 'OWNER', status: 'DRAFT' }
  else if (url.endsWith('/members')) data = [{ userId: 'qa', nickName: '검사', role: 'OWNER' }]
  else data = []
  return { data }
}
apiClient.patch = async (url) => { log('PATCH', url); return { data: { unreadCount: 0 } } }
apiClient.delete = async (url) => { log('DELETE', url); return { data: '' } }
apiClient.post = apiClient.put = apiClient.postForm = async () => { throw new Error('이 검사 화면에서는 쓰기 요청을 지원하지 않습니다.') }
const pages = { planner: PlannerPage, group: PlannerGroupPage, cards: TripCardsPage, detail: TripCardDetailPage, create: TripCardCreatePage, delete: TripCardDeletePage, map: () => h(ProfileInsightPage, { kind: 'map' }), regions: () => h(ProfileInsightPage, { kind: 'countries' }), year: () => h(ProfileInsightPage, { kind: 'achievements' }), notifications: NotificationPage, notification: NotificationDetailPage }
const client = new QueryClient({ defaultOptions: { queries: { retry: false, staleTime: Infinity } } })
const select = document.getElementById('screen')
for (const name of Object.keys(pages)) select.add(new Option(name, name))
function TestPage() {
  const [screen, setScreen] = useState('planner')
  select.onchange = () => { requests = []; client.clear(); setScreen(select.value) }
  return h(pages[screen], { key: screen })
}
const root = createRootRoute({ component: Outlet })
const route = createRoute({ getParentRoute: () => root, path: '/$tripId/$notificationId', component: TestPage })
const router = createRouter({ routeTree: root.addChildren([route]), history: createMemoryHistory({ initialEntries: ['/1/10'] }) })
createRoot(document.getElementById('root')).render(h(QueryClientProvider, { client }, h(ThemeProvider, { theme: appTheme }, h(RouterProvider, { router }))))
</script></body></html>
