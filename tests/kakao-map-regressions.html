<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지도 SDK 연결·주소 변환 모의 회귀 검사</title><button id="run">회귀 검사 실행</button><pre id="result">SDK 모의 객체 검사입니다. 실제 지도 타일·외부 주소 API의 검증이 아닙니다.</pre><div id="root"></div>
<script type="module">
import {createElement as h,useState} from 'react'
import {createRoot} from 'react-dom/client'
import {QueryClient,QueryClientProvider} from '@tanstack/react-query'
import {createRootRoute,createRouter,RouterProvider} from '@tanstack/react-router'
import {ThemeProvider} from 'styled-components'
import {RecordLocationMap} from '/src/widgets/record-map/ui/RecordLocationMap.tsx'
import {PlannerCriteriaStep} from '/src/widgets/planner/ui/PlannerCriteriaStep.tsx'
import {apiClient} from '/src/shared/libs/api-client.ts'
import {appTheme} from '/src/shared/theme/index.ts'
import {GlobalStyle} from '/src/shared/ui/global-style/index.ts'
if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('로컬 전용')
let failSdk=true,geoStatus='OK',geoDelay=0,geocodeCalls=[],generated=[],mountedMarkers=0
class LatLng{constructor(lat,lng){this.lat=lat;this.lng=lng}getLat(){return this.lat}getLng(){return this.lng}}
class MapView{constructor(el,{center}){this.el=el;el.dataset.sdk='simulated';this.setCenter(center)}setCenter(p){this.el.dataset.center=`${p.lat},${p.lng}`}setBounds(b){this.el.dataset.bounds=String(b.points.length)}relayout(){}}
class Marker{constructor({map}){this.el=document.createElement('i');this.el.dataset.marker='true';map.el.append(this.el);mountedMarkers++}setMap(map){if(!map){this.el.remove();mountedMarkers--}}}
class Overlay{constructor({map,content}){this.content=content;map.el.append(content)}setMap(map){if(!map)this.content.remove()}}
const realAppend=document.head.append.bind(document.head)
document.head.append=(...nodes)=>{for(const node of nodes){if(node.tagName==='SCRIPT'&&node.src.startsWith('https://dapi.kakao.com/v2/maps/sdk.js')){
 queueMicrotask(()=>{if(failSdk){node.dispatchEvent(new Event('error'));return}window.kakao={maps:{load:cb=>cb(),LatLng,Map:MapView,LatLngBounds:class{points=[];extend(p){this.points.push(p)}},Marker,CustomOverlay:Overlay,services:{Status:{OK:'OK'},Geocoder:class{coord2Address(lng,lat,cb){geocodeCalls.push([lng,lat]);setTimeout(()=>cb(geoStatus==='OK'?[{road_address:{address_name:'경상북도 경주시 불국로 385'},address:{address_name:'경북 경주시 진현동 15'}}]:[],geoStatus),geoDelay)}}}}};node.dispatchEvent(new Event('load'))});
 }else realAppend(node)}}
Object.defineProperty(navigator,'geolocation',{configurable:true,value:{getCurrentPosition:success=>setTimeout(()=>success({coords:{latitude:35.79,longitude:129.33}}),0)}})
apiClient.get=async path=>({data:path==='/profile/travel-preferences'?{preferredTransport:'CAR',dailyScheduleCount:3,canUseStairs:true}:path==='/planners/blocks'?[{type:'COMPANION',label:'동행',options:['혼자','친구']}]:path==='/places/search'?[{name:'경주역',address:'경북 경주시',latitude:35.8,longitude:129.2}]:[]})
apiClient.post=async(path,payload)=>{if(path!=='/planners/generate')throw Error('예상 밖 쓰기');generated.push(payload);throw Error('검사용 생성 중단')}
const locations=[{name:'불국사',latitude:35.79,longitude:129.33,photos:'2026-11-24'},{name:'첨성대',latitude:35.83,longitude:129.22,photos:'2026-11-24'},{name:'좌표 없음',photos:'2026-11-24'}]
const draft={cityName:'경주',regionName:'경북',regionCode:'47',startDate:'2099-01-01',endDate:'2099-01-02',blocks:[{type:'COMPANION',value:'혼자'}]}
function View(){const[mode,setMode]=useState('map'),[version,setVersion]=useState(0),[selected,setSelected]=useState(null);return h('div',null,h('button',{id:'criteria',onClick:()=>{setMode('criteria');setVersion(v=>v+1)}},'기준 다시 열기'),h('div',{id:'screen','data-mode':mode,'data-version':version},mode==='map'?h(RecordLocationMap,{locations,selectedIndex:selected,onSelect:setSelected}):h(PlannerCriteriaStep,{key:version,draft})))}
const client=new QueryClient({defaultOptions:{queries:{retry:false},mutations:{retry:false}}})
createRoot(document.getElementById('root')).render(h(QueryClientProvider,{client},h(ThemeProvider,{theme:appTheme},h(GlobalStyle),h(RouterProvider,{router:createRouter({routeTree:createRootRoute({component:View})})}))))
const screen=()=>document.getElementById('screen'),button=label=>[...screen().querySelectorAll('button')].find(e=>e.textContent.trim()===label)
const check=(ok,msg)=>{if(!ok)throw Error(msg)}
const until=async fn=>{const limit=Date.now()+6000;while(!fn()){if(Date.now()>limit)throw Error('갱신 시간 초과');await new Promise(r=>setTimeout(r,20))}}
const departure=async()=>{const before=Number(screen().dataset.version);document.getElementById('criteria').click();await until(()=>Number(screen().dataset.version)>before&&button('혼자'));button('혼자').click();await until(()=>button('지금 있는 곳'))}
const review=async()=>{button('나머지는 기본으로 만들기').click();await until(()=>button('AI로 일정 만들기'))}
const setInput=(el,value)=>{Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(el,value);el.dispatchEvent(new Event('input',{bubbles:true}))}
document.getElementById('run').onclick=async()=>{try{
 await until(()=>button('지도 다시 불러오기'));failSdk=false;button('지도 다시 불러오기').click();await until(()=>screen().querySelectorAll('.record-map-pin').length===2)
 check(mountedMarkers===2,'유효 좌표 마커 개수 오류');const map=screen().querySelector('[aria-label="방문 장소 지도"]');check(map.dataset.bounds==='2','모든 장소 범위 맞춤 누락');screen().querySelectorAll('.record-map-pin')[1].click();await until(()=>map.dataset.center==='35.83,129.22');check(screen().querySelectorAll('.record-map-pin')[1].getAttribute('aria-pressed')==='true','선택 핀 상태 누락')
 await departure();check(mountedMarkers===0,'지도 해제 후 마커 잔존');button('지금 있는 곳').click();await until(()=>screen().textContent.includes('출발지: 경상북도 경주시 불국로 385'))
 check(JSON.stringify(geocodeCalls[0])==='[129.33,35.79]','주소 변환 좌표 순서 오류');await review();button('AI로 일정 만들기').click();await until(()=>generated.length===1&&!button('AI가 일정을 만드는 중…'))
 check(generated[0].departurePoint.placeName==='경상북도 경주시 불국로 385','생성 요청에 도로명 주소 누락');check(generated[0].departurePoint.latitude===35.79,'출발 좌표 변경')
 geoStatus='ZERO_RESULTS';await departure();button('지금 있는 곳').click();await until(()=>screen().textContent.includes('다른 곳 찾기를 이용해주세요.'));await review();button('AI로 일정 만들기').click();await until(()=>button('지금 있는 곳'));check(generated.length===1,'주소 확인 실패 후 생성 허용')
 geoStatus='OK';geoDelay=1000;await departure();button('지금 있는 곳').click();await until(()=>button('주소 확인 중…'));button('다른 곳 찾기').click();await until(()=>document.querySelector('input[name=placeSearch]'));setInput(document.querySelector('input[name=placeSearch]'),'경주역');await until(()=>[...document.querySelectorAll('dialog button')].some(e=>e.textContent.includes('경주역')));[...document.querySelectorAll('dialog button')].find(e=>e.textContent.includes('경주역')).click();await new Promise(r=>setTimeout(r,1100));check(screen().textContent.includes('출발지: 경주역'),'늦은 주소 응답이 새 출발지를 덮어씀')
 document.getElementById('result').textContent='PASS: SDK 실패·재시도 / 좌표 핀·범위·선택·정리 / 도로명 주소·좌표 순서 / 주소 실패 시 생성 차단 / 늦은 응답 무시 (SDK 모의 객체 검사)'
}catch(error){document.getElementById('result').textContent='FAIL: '+error.message;console.error(error)}}
</script></html>
