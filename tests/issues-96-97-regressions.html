<!doctype html><html lang="ko"><meta charset="UTF-8"><title>여행카드 사진 업로드 검사</title>
<body><div id="root"></div><script type="module">
import {createElement as h} from 'react'
import {createRoot} from 'react-dom/client'
import {QueryClient,QueryClientProvider} from '@tanstack/react-query'
import {createRootRoute,createRouter,RouterProvider} from '@tanstack/react-router'
import {ThemeProvider} from 'styled-components'
import {AxiosError} from 'axios'
import {TripCardPhotoComposer} from '/src/widgets/trip-cards/ui/TripCardPhotoComposer.tsx'
import {TripCardDetailView} from '/src/widgets/trip-cards/ui/TripCardModeViews.tsx'
import {apiClient} from '/src/shared/libs/api-client.ts'
import {appTheme} from '/src/shared/theme/index.ts'
import {GlobalStyle} from '/src/shared/ui/global-style/index.ts'
if(location.hostname!=='127.0.0.1')throw Error('로컬 전용 검사')
const params=new URLSearchParams(location.search)
const cards=[{tripId:1,title:'끝난 여행',startDate:'2000-01-01',endDate:'2000-01-02'},{tripId:2,title:'예정 여행',startDate:'2099-01-01',endDate:'2099-01-02'}]
window.fixtureUploads=[]
apiClient.postForm=apiClient.post=async(path,data)=>{
 window.fixtureUploads.push({path,file:data.imageFile?.name})
 if(params.has('conflict'))throw new AxiosError('Request failed','ERR_BAD_REQUEST',undefined,undefined,{status:409,data:{message:'여행 종료 후에는 여행 카드를 수정할 수 없습니다.'}})
 return {data:{entryId:1}}
}
apiClient.get=apiClient.put=apiClient.patch=apiClient.delete=async()=>{throw Error('외부 요청 금지')}
const client=new QueryClient({defaultOptions:{queries:{retry:false},mutations:{retry:false}}})
const View=()=>h('main',{style:{padding:'1rem'}},params.has('detail')?h(TripCardDetailView,{detail:cards[params.has('active')?1:0],navigate:()=>{}}):h(TripCardPhotoComposer,{cards}))
const router=createRouter({routeTree:createRootRoute({component:View})})
createRoot(document.getElementById('root')).render(h(QueryClientProvider,{client},h(ThemeProvider,{theme:appTheme},h(GlobalStyle),h(RouterProvider,{router}))))
</script></body></html>
