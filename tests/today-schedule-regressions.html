<!doctype html>
<html lang="ko"><meta charset="UTF-8"><title>오늘 일정 · 화장실 회귀 검사</title>
<body><button id="run">회귀 검사 실행</button><pre id="result" style="white-space:pre-wrap">127.0.0.1 개발 서버에서 실행하세요. 모든 서버 요청은 테스트 응답으로 대체됩니다.</pre><div id="root"></div>
<script type="module">
import { createElement as h, useState } from 'react'
import { createRoot } from 'react-dom/client'
import { QueryClient, QueryClientProvider } from '@tanstack/react-query'
import { createRootRoute, createRouter, RouterProvider } from '@tanstack/react-router'
import { ThemeProvider } from 'styled-components'
import { MainPage } from '/src/widgets/main/ui/MainPage.tsx'
import { TodaySchedule } from '/src/widgets/main/ui/TodaySchedule.tsx'
import { PlannerScheduleEditor } from '/src/widgets/planner/ui/PlannerScheduleEditor.tsx'
import { apiClient } from '/src/shared/libs/api-client.ts'
import { GlobalStyle } from '/src/shared/ui/global-style/index.ts'
import { appTheme } from '/src/shared/theme/index.ts'

if (location.hostname !== '127.0.0.1') throw new Error('127.0.0.1에서 실행해주세요.')
const date = new Date()
const today = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`
const slots = [
  { slotId: 98765401, order: 0, place: { tourPlaceId: 1, name: '첫 장소', categoryLabel: '관광지', latitude: 35, longitude: 128 }, routeStatus: 'CALCULATING', routeFromPrevious: { transportMode: 'CAR', durationMinutes: 999 } },
  { slotId: 98765402, order: 1, place: { tourPlaceId: 2, name: '둘째 장소', categoryLabel: '맛집', latitude: 36, longitude: 129 }, routeStatus: 'READY', routeFromPrevious: { transportMode: 'PUBLIC_TRANSIT', durationMinutes: 25, walkingMinutes: 5, steps: [{ type: 'BUS', name: '100번' }] } },
  { slotId: 98765403, order: 2, place: { tourPlaceId: 1, name: '첫 장소 재방문', categoryLabel: '관광지', latitude: 35, longitude: 128 }, routeStatus: 'API_ERROR', routeFromPrevious: { transportMode: 'PUBLIC_TRANSIT', durationMinutes: 777 } },
  { slotId: 98765404, order: 3, place: { tourPlaceId: 3, name: '마지막 장소', categoryLabel: '카페' } },
]
let plan = { status: 'DURING', cityName: '서울', startDate: today, endDate: today, todaySchedule: slots }
const requests = []
apiClient.get = async (url) => {
  requests.push(url)
  let data
  if (url === '/main/dday') data = plan
  else if (url.includes('/accessibility')) data = url.includes('/1/') ? { matched: true, items: [{ key: 'RESTROOM', text: '장애인 전용 화장실 있음' }] } : url.includes('/2/') ? { matched: false, items: [{ key: 'RESTROOM', text: '표시되면 안 되는 정보' }] } : { matched: true, items: [{ key: 'ROUTE', text: '경사로' }] }
  else if (url.includes('unread')) data = { unreadCount: 0 }
  else data = []
  return { data }
}
apiClient.put = apiClient.post = apiClient.delete = async () => { throw new Error('서버 쓰기 요청 발생') }
const client = new QueryClient({ defaultOptions: { queries: { retry: false } } })
function TestView() {
  const [mode, setMode] = useState('main')
  const [version, setVersion] = useState(0)
  return h('div', null,
    h('button', { id: 'reopen', onClick: () => setVersion(value => value + 1) }, '화면 다시 열기'),
    h('button', { id: 'confirmed', onClick: () => setMode('confirmed') }, '확정 일정 검사'),
    h('button', { id: 'draft', onClick: () => setMode('draft') }, '초안 편집 검사'),
    h('button', { id: 'next-day', onClick: () => setMode('next-day') }, '다음 날 검사'),
    h('button', { id: 'main', onClick: () => setMode('main') }, '홈 검사'),
    h('div', { id: 'screen' }, mode === 'main' ? h(MainPage, { key: version }) : mode === 'next-day' ? h(TodaySchedule, { key: 'next-day', date: '2099-01-01', slots }) : h(PlannerScheduleEditor, { key: `${mode}:${version}`, plannerId: 987654321, schedule: { days: [{ date: today, slots }] }, isConfirmed: mode === 'confirmed', canManage: true, onEditingChange: () => {} })))
}
const route = createRootRoute({ component: TestView })
createRoot(document.getElementById('root')).render(h(QueryClientProvider, { client }, h(ThemeProvider, { theme: appTheme }, h(GlobalStyle), h(RouterProvider, { router: createRouter({ routeTree: route }) }))))
const check = (value, message) => { if (!value) throw new Error(message) }
const until = async fn => { const limit = Date.now() + 5000; while (!fn()) { if (Date.now() > limit) throw new Error('화면 갱신 시간 초과'); await new Promise(resolve => setTimeout(resolve, 20)) } }
const screen = () => document.getElementById('screen')
const visit = name => screen().querySelector(`article[aria-label="${name}"] button`)
const next = () => [...screen().querySelectorAll('article')].find(el => el.textContent.includes('다음 갈 곳'))?.getAttribute('aria-label')
const accessibilityRequests = () => requests.filter(url => url.includes('/accessibility'))
document.getElementById('run').onclick = async () => {
  document.getElementById('run').disabled = true
  try {
    // Dedicated test date/slot IDs; preserve any prior data on this isolated origin.
    const storageKey = `parttrip:visited:${today}`
    const previous = localStorage.getItem(storageKey)
    try {
      localStorage.setItem(storageKey, '[]')
      document.getElementById('reopen').click()
      await until(() => visit('첫 장소') && next() === '첫 장소')
      check([...screen().querySelectorAll('article[aria-label]')].map(el => el.getAttribute('aria-label')).join() === '첫 장소,둘째 장소,첫 장소 재방문,마지막 장소', '서버 일정 순서가 바뀜')
      const firstLink = screen().querySelector('a[aria-label="첫 장소 카카오맵에서 길 안내 열기"]')
      check(firstLink?.href.includes('/link/to/'), '첫 장소 길 안내에 출발지 포함됨')
      check(!screen().textContent.includes('999분') && !screen().textContent.includes('경로를 계산하고 있어요.'), '첫 장소 서버 경로 또는 안내 표시')
      const secondLink = screen().querySelector('a[aria-label="둘째 장소 카카오맵에서 길 안내 열기"]')
      check(secondLink?.href.includes('/by/traffic/') && secondLink.href.includes(',35,128/'), '장소 사이 길 안내 오류')
      check(!screen().querySelector('a[aria-label="첫 장소 재방문 카카오맵에서 길 안내 열기"]'), '다음 장소가 아닌 곳에 길 안내 표시')
      check(!screen().textContent.includes('777분'), 'READY가 아닌 경로 표시')
      check(screen().textContent.includes('25분') && screen().textContent.includes('도보 5분'), '경로 요약 없음')
      check(!screen().querySelector('a[aria-label="마지막 장소 카카오맵에서 길 안내 열기"]'), '좌표 없는 장소에 잘못된 길 안내 표시')
      await until(() => screen().textContent.includes('화장실 · 장애인 전용 화장실 있음'))
      check(!screen().textContent.includes('표시되면 안 되는 정보'), 'matched false 정보를 표시함')
      check([...screen().querySelectorAll('article[aria-label]')].filter(el => el.textContent.includes('화장실 ·')).length === 2, '화장실 항목이 없는 장소에 정보 표시')
      check(accessibilityRequests().filter(url => url.includes('/1/')).length === 1, '중복 장소 API 반복 호출')
      check(!requests.some(url => url.includes('/confirmed-places')), '홈에서 불필요한 확정 장소 API 호출')
      visit('첫 장소').click()
      await until(() => next() === '둘째 장소')
      check(visit('첫 장소').getAttribute('aria-pressed') === 'true', '방문 체크 없음')
      check(visit('첫 장소').textContent === '취소', '방문 완료 버튼 문구 오류')
      check(!screen().querySelector('article[aria-label="첫 장소"]').textContent.includes('화장실 ·'), '다녀온 장소 화장실 표시')
      visit('둘째 장소').click()
      await until(() => next() === '첫 장소 재방문')
      check(!screen().textContent.includes('25분'), '다녀온 장소 경로 표시')
      check(screen().querySelector('a[aria-label="첫 장소 재방문 카카오맵에서 길 안내 열기"]')?.href.includes('/link/to/'), '경로 실패 길 안내에 이전 장소 출발지 포함됨')
      visit('첫 장소 재방문').click()
      await until(() => next() === '마지막 장소')
      check(!screen().textContent.includes('경로를 불러오지 못했어요'), '다녀온 장소 실패 안내 표시')
      visit('둘째 장소').click()
      await until(() => next() === '둘째 장소')
      visit('첫 장소 재방문').click()
      await until(() => next() === '둘째 장소')
      check(JSON.parse(localStorage.getItem(storageKey)).includes(slots[0].slotId), '방문 저장 없음')
      document.getElementById('reopen').click()
      await until(() => next() === '둘째 장소' && visit('첫 장소').getAttribute('aria-pressed') === 'true')
      visit('첫 장소').click()
      await until(() => next() === '첫 장소')
      check(!JSON.parse(localStorage.getItem(storageKey)).includes(slots[0].slotId), '방문 체크 취소 저장 실패')
      for (const name of ['첫 장소', '둘째 장소', '첫 장소 재방문', '마지막 장소']) {
        visit(name).click()
        await until(() => visit(name).getAttribute('aria-pressed') === 'true')
      }
      check(!next() && screen().textContent.includes('오늘 일정을 모두 다녀왔어요.'), '모든 장소 방문 후 다음 장소가 남음')
      const beforeReopen = accessibilityRequests().length
      document.getElementById('confirmed').click()
      await until(() => screen().textContent.includes('확정된 일정입니다.') && screen().textContent.includes('화장실 · 장애인 전용 화장실 있음'))
      check(accessibilityRequests().length === beforeReopen, '확정 화면에서 같은 장소를 다시 요청함')
      client.removeQueries({ queryKey: ['travel', 'tour-place-accessibility'] })
      const beforeEditing = accessibilityRequests().length
      document.getElementById('draft').click()
      await until(() => [...screen().querySelectorAll('button')].some(el => el.textContent === '일정 편집'))
      ;[...screen().querySelectorAll('button')].find(el => el.textContent === '일정 편집').click()
      await until(() => [...screen().querySelectorAll('button')].some(el => el.textContent === '취소'))
      check(!screen().textContent.includes('화장실 ·') && accessibilityRequests().length === beforeEditing, '편집 중 무장애 API 호출')
      check(!screen().querySelector('button[aria-controls]'), '편집 중 무장애 조회 버튼 노출')
      document.getElementById('next-day').click()
      await until(() => next() === '첫 장소')
      plan = { ...plan, status: 'BEFORE' }
      await client.invalidateQueries({ queryKey: ['travel', 'dday'] })
      document.getElementById('main').click()
      await until(() => !screen().querySelector('section[aria-label="오늘 갈 곳"]'))
      plan = { ...plan, status: 'DURING', todaySchedule: [] }
      await client.invalidateQueries({ queryKey: ['travel', 'dday'] })
      await until(() => screen().textContent.includes('오늘은 정해진 일정이 없어요'))
      check(!screen().querySelector('button[aria-label$=" 다녀왔어요"]'), '빈 일정에 방문 버튼 노출')
    } finally {
      if (previous === null) localStorage.removeItem(storageKey)
      else localStorage.setItem(storageKey, previous)
    }
    document.getElementById('result').textContent = 'PASS: 홈 일정 순서·경로·방문 저장·재진입·날짜 분리, 확정 일정 화장실 표시·정보 없음 숨김·중복 캐시·편집 중 요청 차단, 여행 전·빈 일정'
  } catch (error) { document.getElementById('result').textContent = `FAIL: ${error.message}` }
}
</script></body></html>
