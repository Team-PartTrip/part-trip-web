<!doctype html><html lang="ko"><meta charset="UTF-8"><title>홈 배경·보호자 일정 검사</title>
<body><div id="root"></div><script type="module">
import {createElement as h} from 'react'
import {createRoot} from 'react-dom/client'
import {QueryClient,QueryClientProvider} from '@tanstack/react-query'
import {createRootRoute,createRouter,RouterProvider} from '@tanstack/react-router'
import {ThemeProvider} from 'styled-components'
import {MainPage} from '/src/widgets/main/ui/MainPage.tsx'
import {SeniorTravelPanel} from '/src/widgets/guardians/ui/SeniorTravelPanel.tsx'
import {apiClient} from '/src/shared/libs/api-client.ts'
import {appTheme,highContrastTheme} from '/src/shared/theme/index.ts'
import {GlobalStyle} from '/src/shared/ui/global-style/index.ts'
if(location.hostname!=='127.0.0.1')throw Error('로컬 전용 검사')
const params=new URLSearchParams(location.search),mode=params.get('mode'),kind=params.get('case')
const photo=location.origin+'/src/shared/assets/figma/home-hero.webp'
const slots=[{slotId:1,place:{tourPlaceId:11,name:'감천문화마을'}},{slotId:2,place:null},{slotId:3,place:{tourPlaceId:12,name:'직접 고른 숙소'}},{slotId:4,place:{tourPlaceId:13,name:'  '}},{slotId:5,place:{tourPlaceId:14,name:'흰여울문화마을'}}]
window.fixtureRequests=[]
apiClient.get=async path=>{
 window.fixtureRequests.push(path)
 let data=[]
 if(path==='/main/dday')data={status:kind==='none'?'NO_TRIP':kind==='before'?'BEFORE':'DURING',dday:'D-2',cityName:'부산',startDate:'2099-01-01',endDate:'2099-01-02',todaySchedule:kind==='empty'?[]:slots}
 else if(path==='/main/tour-place')data=kind==='no-image'?[]:[{tourPlaceId:20,category:'맛집',placeName:'첫 사진',imageUrl:location.origin+'/src/shared/assets/figma/record-map-photo.png'},{tourPlaceId:21,category:'명소',placeName:'명소 사진',imageUrl:kind==='broken'?location.origin+'/missing-hero-photo.png':photo}]
 else if(path==='/guardians/seniors/senior/planners')data=[{plannerId:7,title:'부산 가족여행',cityName:'부산'}]
 else if(path.endsWith('/schedule'))data={days:[{date:'2099-01-01',slots:kind==='empty'?[]:slots},{date:'2099-01-02',slots:[{place:null}]}]}
 else if(path.endsWith('/location'))data=null
 else if(path.includes('unread-count'))data={unreadCount:0}
 return {data}
}
apiClient.post=apiClient.put=apiClient.patch=apiClient.delete=async()=>{throw Error('외부 쓰기 금지')}
const client=new QueryClient({defaultOptions:{queries:{retry:false,staleTime:Infinity}}})
const View=()=>mode==='guardian'?h('div',{style:{padding:'1rem'}},h(SeniorTravelPanel,{senior:{userId:'senior'},seniorLabel:'가족',dateTimeFormatter:new Intl.DateTimeFormat('ko-KR')})):h(MainPage)
const router=createRouter({routeTree:createRootRoute({component:View})})
createRoot(document.getElementById('root')).render(h(QueryClientProvider,{client},h(ThemeProvider,{theme:params.has('contrast')?highContrastTheme:appTheme},h(GlobalStyle),h(RouterProvider,{router}))))
</script></body></html>
