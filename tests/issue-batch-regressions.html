<!doctype html><html lang="ko"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>이슈 62–74 회귀 검사</title>
<style>pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<button id="run">전체 회귀 검사 실행</button><pre id="result">모든 API는 로컬 응답이며 실제 데이터는 변경하지 않아요.</pre><div id="root"></div>
<script type="module">
import { createElement as h, useState } from 'react'
import { createRoot } from 'react-dom/client'
import { QueryClient, QueryClientProvider } from '@tanstack/react-query'
import { createRootRoute, createRouter, RouterProvider } from '@tanstack/react-router'
import { ThemeProvider } from 'styled-components'
import { PlannerCriteriaStep } from '/src/widgets/planner/ui/PlannerCriteriaStep.tsx'
import { PlannerScheduleStep } from '/src/widgets/planner/ui/PlannerScheduleStep.tsx'
import { PlannerPage } from '/src/widgets/planner/ui/PlannerPage.tsx'
import { RecordPage } from '/src/widgets/record/ui/RecordPage.tsx'
import { RecordMapPage } from '/src/widgets/record-map/ui/RecordMapPage.tsx'
import { TripCardsPage } from '/src/widgets/trip-cards/ui/TripCardsPage.tsx'
import { TripCardPhotoComposer } from '/src/widgets/trip-cards/ui/TripCardPhotoComposer.tsx'
import { GuardiansPage } from '/src/widgets/guardians/ui/GuardiansPage.tsx'
import { FestivalSection } from '/src/widgets/record-calendar/ui/RecordCalendarSections.tsx'
import { AppShell } from '/src/widgets/app-shell/ui/AppShell.tsx'
import { apiClient } from '/src/shared/libs/api-client.ts'
import { appTheme } from '/src/shared/theme/index.ts'
import { GlobalStyle } from '/src/shared/ui/global-style/index.ts'
if (!['localhost','127.0.0.1'].includes(location.hostname)) throw new Error('로컬에서만 실행하세요.')
let failReads = true, pollReads = 0, generationReject, generationResolve, uploadCalls = [], readCalls = []
const pref = { preferredTransport:'CAR',dailyScheduleCount:4,canUseStairs:false,usesWheelchair:true,limitedWalking:false,avoidFoods:['MEAT'] }
const originalSetTimeout = window.setTimeout.bind(window)
window.setTimeout = (fn, delay, ...args) => originalSetTimeout(fn, delay === 3000 ? 5 : delay, ...args)
apiClient.get = async path => {
  readCalls.push(path)
  if (path === '/profile/travel-preferences') return { data: pref }
  if (path === '/planners/blocks') return { data: [{ type:'COMPANION',label:'동행',options:['혼자','친구'] }] }
  if (path === '/planners/7/schedule') { pollReads++; return { data: {plannerId:7, cityName:'서울',days:[{date:'2099-01-01',slots:[{slotId:1,tourPlaceId:1,place:{tourPlaceId:1,name:'장소',latitude:37.5,longitude:127},routeStatus:'CALCULATING'}]}]} } }
  if (path === '/planners/7') return { data: {plannerId:7,role:'OWNER',memberCount:1,status:'PLANNING',cityName:'서울'} }
  if (['/planners','/travel-cards','/guardians/me','/guardians/seniors'].includes(path)) {
    if(failReads) throw new Error('테스트 불러오기 실패')
    return { data: [] }
  }
  if (path.includes('unread')) return { data: {unreadCount:0} }
  return { data: [] }
}
apiClient.put = async () => { throw new Error('변경 없는 편의 설정 저장 요청') }
apiClient.post = async path => {
  if(path !== '/planners/generate') throw new Error('예상 밖 쓰기')
  return new Promise((resolve,reject) => { generationReject=reject; generationResolve=resolve })
}
apiClient.postForm = async (path, body, config) => { uploadCalls.push(config.params?.comment); return {data:{entryId:uploadCalls.length}} }
const client = new QueryClient({defaultOptions:{queries:{retry:false,staleTime:Infinity},mutations:{retry:false}}})
const draft={cityName:'서울',regionCode:'11',startDate:'2099-01-01',endDate:'2099-01-01',blocks:[{type:'COMPANION',value:'혼자'}]}
function View() {
  const [mode,setMode]=useState('record')
  let content
  if(mode==='record') content=h(RecordPage)
  if(mode==='map') content=h(RecordMapPage)
  if(mode==='cards') content=h(TripCardsPage)
  if(mode==='guardians') content=h(GuardiansPage)
  if(mode==='planner') content=h(PlannerPage)
  if(mode==='schedule') content=h(PlannerScheduleStep,{currentDraft:draft})
  if(mode==='criteria') content=h(AppShell,null,h(PlannerCriteriaStep,{draft}))
  if(mode==='photos') content=h(TripCardPhotoComposer,{cards:[{tripId:7,title:'테스트 여행'}]})
  if(mode==='festival') content=h(FestivalSection,{isLoading:false,onBack:()=>{},onClearDate:()=>{},onCategoryChange:()=>{},categoryFilter:'ALL',categories:['문화'],visibleFestivals:[{title:'여러 날 축제',startDate:'2026-10-27',endDate:'2026-11-22'}],viewMonth:new Date(2026,9,1)})
  return h('div',null,h('nav',null,...['record','map','cards','guardians','planner','schedule','criteria','photos','festival'].map(value=>h('button',{key:value,id:'mode-'+value,onClick:()=>{if(mode!==value){client.clear();setMode(value)}}},value)),h('button',{id:'leave',onClick:()=>{void router.navigate({to:'/test-away'})}},'다른 화면으로'),h('button',{id:'finish-generation',onClick:()=>generationReject?.({isAxiosError:true,response:{data:{message:'수동 검증용 생성 실패'}}})},'생성 실패 응답 보내기')) , h('div',{id:'screen','data-mode':mode},content))
}
const route=createRootRoute({component:View})
const router=createRouter({routeTree:route})
createRoot(document.getElementById('root')).render(h(QueryClientProvider,{client},h(ThemeProvider,{theme:appTheme},h(GlobalStyle),h(RouterProvider,{router}))))
const screen=()=>document.getElementById('screen')
const button=label=>[...screen().querySelectorAll('button')].find(el=>el.textContent.trim()===label)
const check=(value,message)=>{if(!value)throw new Error(message)}
const until=async fn=>{const end=Date.now()+6000;while(!fn()){if(Date.now()>end)throw new Error('화면 갱신 시간 초과: '+screen()?.dataset.mode);await new Promise(r=>originalSetTimeout(r,20))}}
const mode=async value=>{document.getElementById('mode-'+value).click();await until(()=>screen().dataset.mode===value)}
const question=()=>screen().querySelector('[data-question]')?.dataset.question
const next=async()=>{const before=question();button('다음').click();await until(()=>question()!==before)}
const review=async()=>{while(question()!=='review')await next()}
const files=count=>{const dt=new DataTransfer();for(let i=0;i<count;i++)dt.items.add(new File(['image'],`test-${i}.png`,{type:'image/png',lastModified:i+1}));const el=screen().querySelector('input[type=file]');el.files=dt.files;el.dispatchEvent(new Event('change',{bubbles:true}))}
document.getElementById('run').onclick=async()=>{
 const key='parttrip:active-planner-id', prev=sessionStorage.getItem(key), draftKey='parttrip:planner-creation-draft', prevDraft=sessionStorage.getItem(draftKey)
 try {
  for(const name of ['record','map','cards','guardians','planner']){
   failReads=true;await mode(name);await until(()=>button('다시 시도'))
   const before=readCalls.length;failReads=false
   const retries=[...screen().querySelectorAll('button')].filter(el=>el.textContent.trim()==='다시 시도')
   retries.forEach(el=>el.click());await until(()=>!button('다시 시도'))
   check(readCalls.length>before,name+' 재조회 누락')
  }
  await mode('festival');await until(()=>screen().textContent.includes('10.27 – 11.22'))
  check(!screen().querySelector('select'),'한 분류 필터가 표시됨')
  await router.navigate({to:'/test-entry'});await mode('criteria');await until(()=>question()==='COMPANION' && button('다음'));await next()
  check(button('휠체어를 써요').getAttribute('aria-pressed')==='true','저장된 휠체어 미리 선택 누락')
  await next()
  check(button('고기').getAttribute('aria-pressed')==='true','저장된 피하는 음식 미리 선택 누락')
  await review();button('AI로 일정 만들기').click();await until(()=>generationReject)
  const unloading=new Event('beforeunload',{cancelable:true});window.dispatchEvent(unloading);check(unloading.defaultPrevented,'생성 중 새로고침 확인 누락')
  const path=location.pathname;document.getElementById('leave').click()
  await new Promise(r=>originalSetTimeout(r,50));check(location.pathname===path,'생성 중 화면 이탈 허용')
  screen().querySelector('a[href="/record"]').click();await new Promise(r=>originalSetTimeout(r,50));check(location.pathname===path,'생성 중 사이드바 이탈 허용')
  router.history.back();await new Promise(r=>originalSetTimeout(r,50));check(location.pathname===path,'생성 중 브라우저 뒤로 이동 허용')
  generationReject({isAxiosError:true,response:{data:{message:'반드시 포함할 곳이 너무 많아요.'}}})
  await until(()=>screen().textContent.includes('반드시 포함할 곳이 너무 많아요.'))
  await mode('photos');files(1);await until(()=>screen().querySelector('textarea'))
  const textarea=screen().querySelector('textarea');Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value').set.call(textarea,'한 장 코멘트');textarea.dispatchEvent(new Event('input',{bubbles:true}))
  await new Promise(r=>originalSetTimeout(r,20));files(1)
  await until(()=>!screen().querySelector('textarea'))
  check(screen().textContent.includes('사진마다 따로 남겨요'),'복수 사진 안내 누락')
  button('여행카드에 담기').click();await until(()=>uploadCalls.length===2 && !button('업로드 중'))
  check(uploadCalls.every(value=>!value),'여러 사진에 공통 코멘트 전송')
  files(1);await until(()=>screen().querySelector('textarea'));
  const single=screen().querySelector('textarea');Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value').set.call(single,'한 장 코멘트');single.dispatchEvent(new Event('input',{bubbles:true}));
  await new Promise(r=>originalSetTimeout(r,20));button('여행카드에 담기').click();await until(()=>uploadCalls.length===3 && !button('업로드 중'));check(uploadCalls[2]==='한 장 코멘트','한 장 코멘트 전송 누락')
  sessionStorage.setItem(key,'7');pollReads=0;await mode('schedule')
  await until(()=>button('경로 다시 불러오기'))
  check(pollReads===21,'경로 재조회 횟수 오류: '+pollReads)
  check(screen().textContent.includes('경로를 불러오지 못했어요.'),'계산 시간 초과 안내 누락')
  await mode('criteria');await until(()=>question()==='COMPANION' && button('다음'));await review();generationResolve=undefined;button('AI로 일정 만들기').click();await until(()=>generationResolve);generationResolve({data:{plannerId:7,days:[]}});await until(()=>location.pathname==='/planner/progress');
  document.getElementById('result').textContent='PASS: 목록 5종 재시도·보호자 양쪽 목록·축제 기간/필터·저장값 미리 선택·생성 중 이동 차단·서버 오류 안내·단일/복수 사진 코멘트·경로 20회 후 시간 초과·새로고침 확인·성공 후 이동'
 }catch(error){document.getElementById('result').textContent='FAIL: '+error.message}
 finally{if(prev===null)sessionStorage.removeItem(key);else sessionStorage.setItem(key,prev);if(prevDraft===null)sessionStorage.removeItem(draftKey);else sessionStorage.setItem(draftKey,prevDraft)}
}
</script></html>
